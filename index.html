<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAETON Badminton - Trang chủ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px 40px;
            box-sizing: border-box;
        }
        /* --- HEADER & AUTH --- */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 48px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .auth-links {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            text-align: right;
        }
        .auth-links a {
            text-decoration: none;
            color: #000000;
            font-weight: bold;
            margin: 0 5px;
        }
        .user-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .user-logged {
            font-weight: bold;
            color: #008000;
            font-size: 16px;
        }
        .btn-open-class, .btn-logout {
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }
        .btn-open-class {
            color: #10b981;
            margin-bottom: 2px;
        }
        .btn-logout {
            color: #ff0000;
        }

        /* --- NAVIGATION BAR (YÊU CẦU MỚI) --- */
        .nav-bar {
            display: flex;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            margin-bottom: 30px;
        }
        .nav-item {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-right: 2px solid #000;
            transition: 0.2s;
        }
        .nav-item:first-child {
            border-left: 2px solid #000;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #f3f4f6;
        }

        /* --- CONTENT SECTIONS --- */
        .content-section {
            display: none; /* Ẩn mặc định */
        }
        .content-section.active {
            display: block; /* Hiện khi active */
        }

        /* --- SEARCH & SLIDER (LỚP HỌC) --- */
        .search-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }
        .search-label {
            font-size: 20px;
            font-weight: bold;
        }
        .search-input {
            width: 400px;
            padding: 8px 12px;
            font-size: 16px;
            border: 2px solid #000;
            outline: none;
        }
        .slider-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
        }
        .courses-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 10px 5px;
            max-width: 1100px;
            border-left: 2px solid #000;
            border-right: 2px solid #000;
        }
        .course-card {
            width: 240px;
            border: 2px solid #000;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .card-header {
            border-bottom: 2px solid #000;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            background-color: #f3f4f6;
        }
        .card-body {
            padding: 12px;
            font-size: 14px;
            line-height: 1.5;
            flex-grow: 1;
        }
        .card-footer {
            padding: 10px;
            text-align: center;
        }
        .btn-register {
            width: 90%;
            padding: 6px 0;
            font-weight: bold;
            background: #fff;
            border: 2px solid #000;
            cursor: pointer;
        }
        .btn-register:hover {
            background: #000;
            color: #fff;
        }
        .arrow-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }
        .arrow-btn svg { width: 25px; height: 40px; }

        /* --- EMPTY STATE FOR NEW TABS --- */
        .empty-tab-content {
            padding: 50px;
            text-align: center;
            font-size: 20px;
            color: #666;
            border: 2px dashed #ccc;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">BAETON Badminton</div>
        <div class="auth-links" id="authNav">
            <a href="login.html">Đăng nhập</a> / <a href="register.html">Đăng ký</a>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('classes', this)">Lớp học</div>
        <div class="nav-item" onclick="switchTab('courts', this)">Sân cầu</div>
        <div class="nav-item" onclick="switchTab('casual', this)">Vãng lai</div>
    </div>

    <div id="tab-classes" class="content-section active">
        <div class="search-container">
            <div class="search-label">Tìm kiếm lớp:</div>
            <input type="text" class="search-input" id="searchInput" placeholder="Nhập khu vực, tên lớp hoặc huấn luyện viên...">
        </div>

        <div class="slider-section">
            <button class="arrow-btn" onclick="scrollSlider(-260)">
                <svg viewBox="0 0 100 100"><polygon points="80,10 20,50 80,90 70,50" style="fill:none;stroke:black;stroke-width:8;"/></svg>
            </button>
            <div class="courses-container" id="coursesContainer">
                <div style="padding: 20px;">Đang tải danh sách lớp học...</div>
            </div>
            <button class="arrow-btn" onclick="scrollSlider(260)">
                <svg viewBox="0 0 100 100"><polygon points="20,10 80,50 20,90 30,50" style="fill:none;stroke:black;stroke-width:8;"/></svg>
            </button>
        </div>
    </div>

    <div id="tab-courts" class="content-section">
        <div class="empty-tab-content">
            <i class="fa-solid fa-map-location-dot" style="font-size: 40px; margin-bottom: 15px;"></i><br>
            Tính năng Tìm kiếm Sân cầu đang được phát triển...
        </div>
    </div>

    <div id="tab-casual" class="content-section">
        <div class="empty-tab-content">
            <i class="fa-solid fa-users-rectangle" style="font-size: 40px; margin-bottom: 15px;"></i><br>
            Tính năng Tìm nhóm Vãng lai đang được phát triển...
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const loggedUser = urlParams.get('user'); 
        const userRole = urlParams.get('role'); 
        const authNav = document.getElementById('authNav');
        const coursesContainer = document.getElementById('coursesContainer');
        let allLocalClasses = [];

        // 1. XỬ LÝ CHUYỂN TAB (KHÔNG RELOAD TRANG)
        function switchTab(tabName, element) {
            // Xóa class active ở tất cả các tab và nội dung
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

            // Kích hoạt tab và nội dung tương ứng
            element.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // 2. HIỂN THỊ THÔNG TIN USER
        if (loggedUser) {
            let userHtml = `<div class="user-container"><span class="user-logged"><i class="fa-solid fa-user"></i> Xin chào, ${decodeURIComponent(loggedUser)}</span>`;
            if (userRole === 'coach') {
                userHtml += `<a href="dashboard_hlv.html?user=${encodeURIComponent(loggedUser)}&role=coach" class="btn-open-class">Mở lớp</a>`;
            }
            userHtml += `<a href="index.html" class="btn-logout" onclick="return confirm('Đăng xuất?')">Đăng xuất</a></div>`;
            authNav.innerHTML = userHtml;
        }

        // 3. LOGIC LOAD LỚP HỌC (GIỮ NGUYÊN BẢN CŨ NHƯNG TỐI ƯU HÓA)
        function loadClasses() {
            const callbackName = 'jsonp_load_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                if (data.status === "success") {
                    allLocalClasses = data.classes;
                    renderClasses(allLocalClasses);
                }
            };
            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=get_classes&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        function renderClasses(list) {
            coursesContainer.innerHTML = "";
            list.forEach(cls => {
                const isFull = cls.slots && cls.slots.split('/')[0] >= cls.slots.split('/')[1];
                const card = document.createElement('div');
                card.className = 'course-card';
                card.id = `card_${cls.id}`;
                card.innerHTML = `
                    <div class="card-header">${cls.className}</div>
                    <div class="card-body">
                        Khu vực: ${cls.area}<br>
                        Trình độ: ${cls.level}<br>
                        Học phí: ${cls.fee}<br>
                        Số lượng: <span id="slot_${cls.id}">${cls.slots}</span><br>
                        HLV: ${cls.coach}
                    </div>
                    <div class="card-footer" id="footer_${cls.id}">
                        ${userRole === 'coach' ? '' : (isFull ? '<button class="btn-register" disabled style="background:#eee;color:#999">Lớp đã full</button>' : `<button class="btn-register" onclick="registerClass('${cls.id}', '${cls.className}', '${cls.slots}')">Đăng ký</button>`)}
                    </div>
                `;
                coursesContainer.appendChild(card);
            });
        }

        function registerClass(id, name, slots) {
            if (!loggedUser) return alert("Vui lòng đăng nhập!");
            if (!confirm(`Xác nhận đăng ký lớp: ${name}?`)) return;

            const callbackName = 'jsonp_reg_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                if (data.status === "success") {
                    alert("Đăng ký thành công!");
                    // Cập nhật UI cục bộ
                    const parts = slots.split('/');
                    const newSlots = (parseInt(parts[0]) + 1) + "/" + parts[1];
                    document.getElementById(`slot_${id}`).innerText = newSlots;
                    if (parseInt(parts[0]) + 1 >= parseInt(parts[1])) {
                        document.getElementById(`footer_${id}`).innerHTML = '<button class="btn-register" disabled style="background:#eee;color:#999">Lớp đã full</button>';
                    }
                } else alert(data.message);
            };
            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=register_student&classId=${id}&className=${encodeURIComponent(name)}&studentName=${encodeURIComponent(loggedUser)}&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        // TÌM KIẾM & CUỘN
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const k = e.target.value.toLowerCase();
            renderClasses(allLocalClasses.filter(c => c.className.toLowerCase().includes(k) || c.area.toLowerCase().includes(k)));
        });

        function scrollSlider(o) { coursesContainer.scrollBy({ left: o, behavior: 'smooth' }); }

        window.onload = loadClasses;
    </script>
</body>
</html>
