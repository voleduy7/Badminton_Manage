<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAETON Badminton - Trang chủ</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="header">
        <div class="logo">BAETON Badminton</div>
        <div class="auth-links">
            <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">
                <i class="fa-solid fa-moon"></i>
            </button>
            <div id="authNav" style="display: flex; gap: 12px;">
                <a href="login.html" class="btn-auth">Đăng nhập</a>
                <a href="register.html" class="btn-auth">Đăng ký</a>
            </div>
        </div>
    </div>

    <div class="nav-wrapper">
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('classes', this)">Lớp học</div>
            <div class="nav-item" onclick="switchTab('courts', this)">Sân cầu</div>
            <div class="nav-item" onclick="switchTab('casual', this)">Vãng lai</div>
        </div>
    </div>

    <div id="tab-classes" class="content-section active">
        <div class="search-container">
            <div class="search-label">Tìm kiếm lớp:</div>
            <input type="text" class="search-input" id="searchInput" placeholder="Nhập khu vực, tên lớp hoặc huấn luyện viên...">
            <button class="btn-near-me"><i class="fa-solid fa-location-crosshairs"></i> Đã định vị</button>
        </div>

        <div class="slider-wrapper">
            <div class="slider-section">
                <button class="arrow-btn" onclick="scrollSlider(-276)">
                    <svg viewBox="0 0 100 100"><polygon points="80,10 20,50 80,90 70,50"/></svg>
                </button>
                <div class="courses-container" id="coursesContainer">
                    <div style="padding: 20px; font-weight: bold;">Đang tải danh sách lớp từ hệ thống...</div>
                </div>
                <button class="arrow-btn" onclick="scrollSlider(276)">
                    <svg viewBox="0 0 100 100"><polygon points="20,10 80,50 20,90 30,50"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="tab-courts" class="content-section">
        <div class="empty-tab-content">Tính năng Tìm kiếm Sân cầu đang phát triển...</div>
    </div>

    <div id="tab-casual" class="content-section">
        <div class="empty-tab-content">Tính năng Tìm nhóm Vãng lai đang phát triển...</div>
    </div>

    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>XÁC NHẬN ĐĂNG KÝ HỌC</span>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal()"></i>
            </div>
            <div class="modal-body" id="modalBodyContent"></div>
            <div class="modal-footer">
                <button class="btn-modal-close" onclick="closeModal()">Hủy bỏ</button>
                <button class="btn-modal-confirm" id="btnSubmitRegistration">Đăng ký</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const loggedUser = urlParams.get('user'); 
        const userRole = urlParams.get('role'); 
        const authNav = document.getElementById('authNav');
        const coursesContainer = document.getElementById('coursesContainer');
        let allLocalClasses = [];

        if (loggedUser) {
            let userHtml = `
                <div class="user-container">
                    <div class="user-header-row">
                        <span class="user-logged"><i class="fa-solid fa-user"></i> Xin chào, ${decodeURIComponent(loggedUser)}</span>
            `;
            
            if (userRole === 'coach') {
                userHtml += `
                        <button class="noti-bell-btn" id="notiBellBtn" onclick="toggleNotiDropdown(event)">
                            <i class="fa-solid fa-bell"></i>
                            <span class="noti-badge" id="notiBadgeCount" style="display:none;">0</span>
                        </button>
                        <div class="noti-dropdown" id="notiDropdownMenu" onclick="event.stopPropagation()">
                            <div class="noti-dropdown-header">
                                <span>Thông báo mới nhận</span>
                                <span style="cursor:pointer;color:#ef4444;" onclick="toggleNotiDropdown(event)">Đóng</span>
                            </div>
                            <div id="notiDropdownContent">
                                <div class="noti-dropdown-empty">Đang tải thông báo...</div>
                            </div>
                        </div>
                `;
            }
            
            userHtml += `
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
            `;
            
            if (userRole === 'coach') {
                userHtml += `
                        <a href="dashboard_hlv.html?user=${encodeURIComponent(loggedUser)}&role=coach" class="btn-open-class">Mở lớp</a>
                        <a href="manage_classes.html?user=${encodeURIComponent(loggedUser)}&role=coach" class="btn-open-class">Lớp của tôi</a>
                `;
            }
            userHtml += `
                        <a href="index.html" class="btn-logout">Đăng xuất</a>
                    </div>
                </div>
            `;
            authNav.innerHTML = userHtml;
            
            if (userRole === 'coach') {
                loadNotificationsCount();
            }
        }

        function loadNotificationsCount() {
            if (!loggedUser || userRole !== 'coach') return;
            
            const callbackName = 'jsonp_noticount_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                
                if (data.status === "success" && data.notifications) {
                    const dropdownContent = document.getElementById('notiDropdownContent');
                    dropdownContent.innerHTML = "";
                    
                    const unreadCount = data.notifications.filter(n => n.status === 'unread').length;
                    const badge = document.getElementById('notiBadgeCount');
                    
                    if (unreadCount > 0) {
                        badge.innerText = unreadCount;
                        badge.style.display = 'block';
                    } else {
                        badge.style.display = 'none';
                    }
                    
                    if (data.notifications.length === 0) {
                        dropdownContent.innerHTML = `<div class="noti-dropdown-empty">Không có thông báo nào.</div>`;
                        return;
                    }
                    
                    data.notifications.forEach(noti => {
                        const item = document.createElement('div');
                        item.className = `noti-dropdown-item ${noti.status === 'unread' ? 'unread' : ''}`;
                        item.innerHTML = `
                            <div>${noti.content}</div>
                            <div class="noti-dropdown-time">${noti.time}</div>
                        `;
                        dropdownContent.appendChild(item);
                    });
                }
            };
            
            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=get_notifications&coachName=${encodeURIComponent(loggedUser)}&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        function toggleNotiDropdown(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('notiDropdownMenu');
            if (!menu) return;

            menu.classList.toggle('show');
            
            if (menu.classList.contains('show')) {
                const badge = document.getElementById('notiBadgeCount');
                if (badge) badge.style.display = 'none';
                
                document.querySelectorAll('.noti-dropdown-item.unread').forEach(item => {
                    item.classList.remove('unread');
                });

                markAllNotificationsAsReadOnBackend();
            }
        }

        function markAllNotificationsAsReadOnBackend() {
            if (!loggedUser || userRole !== 'coach') return;

            const callbackName = 'jsonp_markread_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
            };

            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=mark_notifications_read&coachName=${encodeURIComponent(loggedUser)}&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        window.onclick = function(event) {
            const menu = document.getElementById('notiDropdownMenu');
            if (menu && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        }

        function loadClasses() {
            const callbackName = 'jsonp_load_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                if (data.status === "success") {
                    allLocalClasses = data.classes;
                    renderClasses(allLocalClasses);
                }
            };
            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=get_classes&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        // ĐỒNG BỘ: Tạo cấu trúc Table chứa đầy đủ thuộc tính data-label phục vụ việc biến hình CSS
        function renderClasses(list) {
            coursesContainer.innerHTML = "";
            
            if(list.length === 0) {
                coursesContainer.innerHTML = `<div style="padding: 20px; font-weight: bold;">Hiện chưa có lớp học nào được mở.</div>`;
                return;
            }

            // Tạo phần khung Table chuẩn Responsive
            const tableElement = document.createElement('table');
            tableElement.className = 'responsive-table';
            
            tableElement.innerHTML = `
                <thead>
                    <tr>
                        <th>Tên Lớp Học</th>
                        <th>Khu Vực</th>
                        <th>Trình Độ</th>
                        <th>Học Phí</th>
                        <th>Số Lượng</th>
                        <th>HLV</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody id="tableBodyRowContainer"></tbody>
            `;
            coursesContainer.appendChild(tableElement);
            const tbody = document.getElementById('tableBodyRowContainer');

            list.forEach(cls => {
                let isFull = false;
                if (cls.slots && cls.slots.includes('/')) {
                    const parts = cls.slots.split('/');
                    if(parseInt(parts[0], 10) >= parseInt(parts[1], 10)) isFull = true;
                }
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="Tên Lớp Học" class="class-title-cell">${cls.className}</td>
                    <td data-label="Khu Vực">${cls.area}</td>
                    <td data-label="Trình Độ">${cls.level}</td>
                    <td data-label="Học Phí" class="fee-cell">${cls.fee}</td>
                    <td data-label="Số Lượng"><span id="slot_${cls.id}">${cls.slots}</span></td>
                    <td data-label="HLV">${cls.coach}</td>
                    <td data-label="Hành Động" id="footer_${cls.id}">
                        ${userRole === 'coach' ? '<span style="color:#888; font-style:italic;">HLV không được đăng ký</span>' : (isFull ? '<button class="btn-register" disabled>Lớp đã full</button>' : `<button class="btn-register" onclick="openRegisterPopup('${cls.id}')">Đăng ký</button>`)}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openRegisterPopup(classId) {
            if (!loggedUser) return alert("Vui lòng đăng nhập tài khoản trước khi thực hiện thao tác này!");
            
            const cls = allLocalClasses.find(c => c.id === classId);
            if (!cls) return;

            const modalBody = document.getElementById('modalBodyContent');
            modalBody.innerHTML = `<div style="text-align:center;padding:20px;"><i class="fa-solid fa-spinner fa-spin"></i> Đang lấy hồ sơ...</div>`;
            document.getElementById('registerModal').classList.add('open');

            const callbackName = 'jsonp_coach_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                
                let coach = data.coach || {};
                modalBody.innerHTML = `
                    <div class="section-title"><i class="fa-solid fa-id-card"></i> Hồ sơ huấn luyện viên</div>
                    <div class="coach-profile-wrapper">
                        <img src="${coach.avatar}" class="coach-avatar" alt="Avatar HLV">
                        <div class="coach-info">
                            <strong>Họ và tên:</strong> ${cls.coach}<br>
                            <strong>Tuổi:</strong> ${coach.age}<br>
                            <strong>Số điện thoại:</strong> ${coach.phone}<br>
                            <strong>Email:</strong> ${coach.email}<br>
                            <strong>Thời gian dạy:</strong> ${coach.teachingTime}
                        </div>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <strong>Thành tích cá nhân:</strong><br>
                        <div style="background:#f9f9f9; color:#333; padding:8px; border:1px solid #ddd; font-style:italic; margin-top:4px;">
                            ${coach.achievements}
                        </div>
                    </div>
                    <div class="section-title"><i class="fa-solid fa-graduation-cap"></i> Thông tin lớp học đăng ký</div>
                    <div>
                        <strong>Tên lớp học:</strong> ${cls.className}<br>
                        <strong>Khu vực:</strong> ${cls.area}<br>
                        <strong>Trình độ yêu cầu:</strong> ${cls.level}<br>
                        <strong>Học phí khóa học:</strong> <span style="color:#e11d48; font-weight:bold;">${cls.fee}</span>
                    </div>
                `;
                
                document.getElementById('btnSubmitRegistration').onclick = function() {
                    executeRegistration(cls.id, cls.className, cls.coach, cls.slots);
                };
            };

            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=get_coach_detail&coachName=${encodeURIComponent(cls.coach)}&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        function closeModal() {
            document.getElementById('registerModal').classList.remove('open');
        }

        function executeRegistration(id, name, coachName, currentSlots) {
            const btn = document.getElementById('btnSubmitRegistration');
            btn.disabled = true;
            btn.innerText = `Đang xử lý...`;

            const callbackName = 'jsonp_reg_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                btn.disabled = false;
                btn.innerText = `Đăng ký`;
                
                if (data.status === "success") {
                    alert("Đăng ký thành công! Huấn luyện viên đã nhận được thông báo lớp học.");
                    closeModal();
                    
                    const parts = currentSlots.split('/');
                    const newCount = parseInt(parts[0], 10) + 1;
                    const maxCount = parseInt(parts[1], 10);
                    const updatedStr = newCount + "/" + maxCount;
                    
                    if(document.getElementById(`slot_${id}`)) {
                        document.getElementById(`slot_${id}`).innerText = updatedStr;
                    }
                    
                    const targetedClass = allLocalClasses.find(c => c.id === id);
                    if(targetedClass) targetedClass.slots = updatedStr;

                    if (newCount >= maxCount) {
                        if(document.getElementById(`footer_${id}`)) {
                            document.getElementById(`footer_${id}`).innerHTML = '<button class="btn-register" disabled>Lớp đã full</button>';
                        }
                    }
                } else {
                    alert(data.message);
                }
            };
            
            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=register_student&classId=${id}&className=${encodeURIComponent(name)}&studentName=${encodeURIComponent(loggedUser)}&coachName=${encodeURIComponent(coachName)}&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        function scrollSlider(o) { coursesContainer.scrollBy({ left: o, behavior: 'smooth' }); }
        function switchTab(t, e) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            e.classList.add('active');
            document.getElementById(`tab-${t}`).classList.add('active');
        }
        
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const icon = document.querySelector('#themeToggle i');
            if(document.body.classList.contains('dark-theme')) {
                icon.className = "fa-solid fa-sun";
            } else {
                icon.className = "fa-solid fa-moon";
            }
        }

        window.onload = loadClasses;
    </script>
</body>
</html>
