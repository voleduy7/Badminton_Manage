<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAETON Badminton - Trang chủ</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --card-header-bg: #f3f4f6;
            --card-bg: #ffffff;
            --hover-bg: #000000;
            --hover-text: #ffffff;
            --empty-bg: #fafafa;
            --btn-near-me-bg: #ffffff;
            --shadow-color: #000000;
            --overlay-color: rgba(0, 0, 0, 0.4);
            --modal-header-bg: #ffe600;
        }

        body.dark-theme {
            --bg-color: #121212;          
            --text-color: #ffffff;        
            --border-color: #ffffff;      
            --card-header-bg: #1e1e1e;   
            --card-bg: #1a1a1a;          
            --hover-bg: #ffffff;          
            --hover-text: #000000;
            --empty-bg: #1a1a1a;
            --btn-near-me-bg: #1e1e1e;
            --shadow-color: #ffffff;      
            --overlay-color: rgba(0, 0, 0, 0.7);
            --modal-header-bg: #2d2d2d;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 40px;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        
        .header { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 30px; margin-top: 10px; }
        .logo { font-size: 48px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .auth-links { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 15px; }
        .user-container { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .user-header-row { display: flex; align-items: center; gap: 12px; position: relative; }
        .user-logged { font-weight: bold; color: #00aa00; font-size: 16px; }

        .noti-bell-btn { background: #ffe600; border: 2px solid var(--border-color); box-shadow: 2px 2px 0px var(--shadow-color); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 14px; color: #000 !important; }
        .noti-badge { position: absolute; top: -6px; right: -6px; background-color: #ef4444; color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: bold; border: 1px solid var(--border-color); }
        .noti-dropdown { position: absolute; top: 40px; right: 0; width: 320px; background-color: var(--card-bg); border: 3px solid var(--border-color); box-shadow: 6px 6px 0px var(--shadow-color); z-index: 10000; display: none; max-height: 300px; overflow-y: auto; }
        .noti-dropdown.show { display: block; }
        .noti-dropdown-header { background-color: var(--card-header-bg); padding: 8px 12px; font-weight: bold; font-size: 13px; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; }
        .noti-dropdown-item { padding: 10px 12px; border-bottom: 1px dashed var(--border-color); font-size: 13px; line-height: 1.4; }
        .noti-dropdown-item.unread { background-color: rgba(255, 230, 0, 0.1); font-weight: bold; }
        .noti-dropdown-time { font-size: 11px; color: #777; margin-top: 4px; text-align: right; }
        .noti-dropdown-empty { padding: 20px; text-align: center; font-style: italic; color: #777; }

        .theme-toggle-btn { background: var(--bg-color); color: var(--text-color); border: 2px solid var(--border-color); box-shadow: 2px 2px 0px var(--shadow-color); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: 0.1s; user-select: none; }
        .nav-wrapper { width: 100%; border-bottom: 2px solid var(--border-color); margin-bottom: 40px; }
        .nav-bar { display: inline-flex; background-color: var(--bg-color); gap: 15px; }
        .nav-item { padding: 12px 35px; font-size: 22px; font-weight: bold; cursor: pointer; border: 2px solid var(--border-color); border-bottom: none; transition: 0.1s; user-select: none; background-color: var(--bg-color); color: var(--text-color); }
        .nav-item:hover, .nav-item.active { background-color: var(--hover-bg) !important; color: var(--hover-text) !important; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        .search-container { display: flex; align-items: center; gap: 15px; margin-bottom: 40px; }
        .search-label { font-size: 20px; font-weight: bold; }
        .search-input { width: 400px; padding: 8px 12px; font-size: 16px; border: 2px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color); outline: none; }

        .btn-near-me { padding: 8px 18px; font-size: 16px; font-weight: bold; background-color: var(--btn-near-me-bg); color: var(--text-color); border: 2px solid var(--border-color); box-shadow: 3px 3px 0px var(--shadow-color); cursor: pointer; transition: 0.1s; display: flex; align-items: center; gap: 6px; user-select: none; }
        .btn-near-me:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0px var(--shadow-color); }

        .slider-wrapper { display: flex; justify-content: center; width: 100%; margin-top: 20px; }
        .slider-section { display: flex; align-items: center; gap: 15px; max-width: 100%; }
        .courses-container { display: flex; gap: 20px; overflow-x: auto; padding: 15px 5px; width: 1024px; max-width: calc(100vw - 200px); scrollbar-width: thin; }
        .arrow-btn { width: 40px; height: 40px; background: var(--bg-color); border: 2px solid var(--border-color); box-shadow: 2px 2px 0px var(--shadow-color); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .arrow-btn svg { width: 20px; height: 20px; }
        .arrow-btn svg polygon { stroke: var(--border-color); fill: none; stroke-width: 8; }

        .course-card { width: 236px; border: 2px solid var(--border-color); background-color: var(--card-bg); color: var(--text-color); display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 4px 4px 0px var(--shadow-color); transition: transform 0.1s, box-shadow 0.1s; }
        .card-header { border-bottom: 2px solid var(--border-color); padding: 10px; font-weight: bold; text-align: center; background-color: var(--card-header-bg); font-size: 16px; color: var(--text-color); }
        .card-body { padding: 15px; font-size: 14px; line-height: 1.6; flex-grow: 1; }
        .card-footer { padding: 15px; text-align: center; border-top: 1px dashed var(--border-color); }

        .btn-register, .btn-auth, .btn-open-class, .btn-logout, .btn-modal-close, .btn-modal-confirm { border: 2px solid var(--border-color); background: var(--bg-color); color: var(--text-color); box-shadow: 2px 2px 0px var(--shadow-color); font-weight: bold; cursor: pointer; padding: 6px 12px; text-decoration: none; display: inline-block; }
        .empty-tab-content { padding: 60px; text-align: center; font-size: 18px; color: var(--text-color); border: 2px dashed var(--border-color); background-color: var(--empty-bg); margin-top: 10px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--overlay-color); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-box { background-color: var(--card-bg); border: 4px solid var(--border-color); box-shadow: 8px 8px 0px var(--shadow-color); width: 550px; max-width: 90%; transform: scale(0.9); transition: transform 0.2s ease; display: flex; flex-direction: column; }
        .modal-overlay.open .modal-box { transform: scale(1); }
        .modal-header { background-color: var(--modal-header-bg); color: var(--text-color); padding: 15px; font-size: 20px; font-weight: bold; border-bottom: 4px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; line-height: 1.5; font-size: 15px; }
        .modal-footer { padding: 15px; border-top: 2px dashed var(--border-color); display: flex; justify-content: flex-end; gap: 12px; background-color: var(--card-header-bg); }
        .coach-profile-wrapper { display: flex; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 2px dashed var(--border-color); }
        .coach-avatar { width: 90px; height: 110px; border: 2px solid var(--border-color); box-shadow: 3px 3px 0px var(--shadow-color); object-fit: cover; }
        .section-title { font-weight: bold; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; background-color: var(--hover-bg); color: var(--hover-text); padding: 2px 6px; display: inline-block; margin-bottom: 8px; }
        .btn-modal-confirm { background-color: #22c55e !important; color: white !important; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">BAETON Badminton</div>
        <div class="auth-links">
            <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">
                <i class="fa-solid fa-moon"></i>
            </button>
            <div id="authNav" style="display: flex; gap: 12px;">
                <a href="login.html" class="btn-auth">Đăng nhập</a>
                <a href="register.html" class="btn-auth">Đăng ký</a>
            </div>
        </div>
    </div>

    <div class="nav-wrapper">
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('classes', this)">Lớp học</div>
            <div class="nav-item" onclick="switchTab('courts', this)">Sân cầu</div>
            <div class="nav-item" onclick="switchTab('casual', this)">Vãng lai</div>
        </div>
    </div>

    <div id="tab-classes" class="content-section active">
        <div class="search-container">
            <div class="search-label">Tìm kiếm lớp:</div>
            <input type="text" class="search-input" id="searchInput" placeholder="Nhập khu vực, tên lớp hoặc huấn luyện viên...">
            
            <button class="btn-near-me" id="btnNearMe" onclick="getUserLocation()">
                <i class="fa-solid fa-location-crosshairs"></i> <span id="btnNearMeText">Tìm gần tôi</span>
            </button>
        </div>

        <div class="slider-wrapper">
            <div class="slider-section">
                <button class="arrow-btn" onclick="scrollSlider(-276)">
                    <svg viewBox="0 0 100 100"><polygon points="80,10 20,50 80,90 70,50"/></svg>
                </button>
                <div class="courses-container" id="coursesContainer">
                    <div style="padding: 20px; font-weight: bold;">Đang tải danh sách lớp...</div>
                </div>
                <button class="arrow-btn" onclick="scrollSlider(276)">
                    <svg viewBox="0 0 100 100"><polygon points="20,10 80,50 20,90 30,50"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="tab-courts" class="content-section"><div class="empty-tab-content">Tính năng Tìm sân đang phát triển...</div></div>
    <div id="tab-casual" class="content-section"><div class="empty-tab-content">Tính năng Vãng lai đang phát triển...</div></div>

    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <div class="modal-header"><span>XÁC NHẬN ĐĂNG KÝ HỌC</span><i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal()"></i></div>
            <div class="modal-body" id="modalBodyContent"></div>
            <div class="modal-footer"><button class="btn-modal-close" onclick="closeModal()">Hủy</button><button class="btn-modal-confirm" id="btnSubmitRegistration">Đăng ký</button></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const loggedUser = urlParams.get('user'); 
        const userRole = urlParams.get('role'); 
        const authNav = document.getElementById('authNav');
        const coursesContainer = document.getElementById('coursesContainer');
        let allLocalClasses = [];

        // Toạ độ fallback cho các quận HCMC
        const DISTRICT_COORDINATES = {
            "quận 1": { lat: 10.7760, lng: 106.7011 }, "quận 3": { lat: 10.7843, lng: 106.6812 },
            "quận 4": { lat: 10.7578, lng: 106.7067 }, "quận 5": { lat: 10.7541, lng: 106.6634 },
            "quận 6": { lat: 10.7481, lng: 106.6413 }, "quận 7": { lat: 10.7340, lng: 106.7214 },
            "quận 8": { lat: 10.7240, lng: 106.6286 }, "quận 10": { lat: 10.7746, lng: 106.6669 },
            "quận 11": { lat: 10.7629, lng: 106.6507 }, "quận 12": { lat: 10.8671, lng: 106.6413 },
            "bình thạnh": { lat: 10.8106, lng: 106.7091 }, "gò vấp": { lat: 10.8388, lng: 106.6657 },
            "tân bình": { lat: 10.8014, lng: 106.6525 }, "tân phú": { lat: 10.7925, lng: 106.6183 },
            "bình tân": { lat: 10.7654, lng: 106.5815 }, "phú nhuận": { lat: 10.7992, lng: 106.6803 },
            "thủ đức": { lat: 10.8494, lng: 106.7537 }, "nhà bè": { lat: 10.6662, lng: 106.7461 },
            "bình chánh": { lat: 10.6875, lng: 106.5938 }, "hóc môn": { lat: 10.8842, lng: 106.5920 }
        };

        if (loggedUser) {
            let userHtml = `<div class="user-container"><div class="user-header-row"><span class="user-logged"><i class="fa-solid fa-user"></i> ${decodeURIComponent(loggedUser)}</span>`;
            if (userRole === 'coach') {
                userHtml += `<button class="noti-bell-btn" id="notiBellBtn" onclick="toggleNotiDropdown(event)"><i class="fa-solid fa-bell"></i><span class="noti-badge" id="notiBadgeCount" style="display:none;">0</span></button><div class="noti-dropdown" id="notiDropdownMenu"><div class="noti-dropdown-header"><span>Thông báo</span><span style="cursor:pointer;color:#ef4444;" onclick="toggleNotiDropdown(event)">Đóng</span></div><div id="notiDropdownContent"></div></div>`;
            }
            userHtml += `</div><div style="display: flex; gap: 8px;">`;
            if (userRole === 'coach') userHtml += `<a href="dashboard_hlv.html?user=${encodeURIComponent(loggedUser)}&role=coach" class="btn-open-class">Mở lớp</a><a href="manage_classes.html?user=${encodeURIComponent(loggedUser)}&role=coach" class="btn-open-class">Lớp của tôi</a>`;
            userHtml += `<a href="index.html" class="btn-logout">Đăng xuất</a></div></div>`;
            authNav.innerHTML = userHtml;
            if (userRole === 'coach') loadNotificationsCount();
        }

        // Logic Tìm kiếm hoạt động (FIXED)
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const filtered = allLocalClasses.filter(cls => 
                cls.className.toLowerCase().includes(keyword) || 
                cls.area.toLowerCase().includes(keyword) || 
                cls.coach.toLowerCase().includes(keyword)
            );
            renderClasses(filtered);
        });

        function loadClasses() {
            const callbackName = 'jsonp_load_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                if (data.status === "success") { allLocalClasses = data.classes; renderClasses(allLocalClasses); }
            };
            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=get_classes&callback=${callbackName}`;
            document.body.appendChild(script);
        }

        function renderClasses(list) {
            coursesContainer.innerHTML = "";
            if (list.length === 0) { coursesContainer.innerHTML = `<div style="padding: 20px;">Không có lớp nào.</div>`; return; }
            list.forEach(cls => {
                let isFull = false;
                if (cls.slots && cls.slots.includes('/')) {
                    const parts = cls.slots.split('/');
                    if(parseInt(parts[0]) >= parseInt(parts[1])) isFull = true;
                }
                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <div class="card-header">${cls.className}</div>
                    <div class="card-body">
                        Khu vực: ${cls.area}<br> Trình độ: ${cls.level}<br> Học phí: ${cls.fee}<br> Số lượng: <span id="slot_${cls.id}">${cls.slots}</span><br> HLV: ${cls.coach}
                        ${cls.distance !== undefined && cls.distance !== Infinity ? `<br><span style="color:#22c55e;font-weight:bold;"><i class="fa-solid fa-location-dot"></i> Cách đây: ${cls.distance.toFixed(1)} km</span>` : ''}
                    </div>
                    <div class="card-footer" id="footer_${cls.id}">
                        ${userRole === 'coach' ? '' : (isFull ? '<button class="btn-register" disabled>Full</button>' : `<button class="btn-register" onclick="openRegisterPopup('${cls.id}')">Đăng ký</button>`)}
                    </div>
                `;
                coursesContainer.appendChild(card);
            });
        }

        // Logic Geolocation & Sắp xếp (FIXED)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function getUserLocation() {
            const btnText = document.getElementById('btnNearMeText');
            if (!navigator.geolocation) return alert("Không hỗ trợ định vị.");
            btnText.innerText = "Đang định vị...";
            navigator.geolocation.getCurrentPosition((pos) => {
                const { latitude: uLat, longitude: uLon } = pos.coords;
                btnText.innerText = "Đã định vị";
                const sorted = allLocalClasses.map(cls => {
                    let cLat = parseFloat(cls.lat), cLon = parseFloat(cls.lon);
                    if (isNaN(cLat)) {
                        const area = cls.area.toLowerCase();
                        for (let k in DISTRICT_COORDINATES) if (area.includes(k)) { cLat = DISTRICT_COORDINATES[k].lat; cLon = DISTRICT_COORDINATES[k].lng; break; }
                    }
                    return { ...cls, distance: calculateDistance(uLat, uLon, cLat, cLon) };
                }).sort((a, b) => a.distance - b.distance);
                renderClasses(sorted);
            }, () => { btnText.innerText = "Tìm gần tôi"; alert("Lỗi định vị."); });
        }

        function openRegisterPopup(id) { /* Giữ nguyên logic cũ */ }
        function closeModal() { document.getElementById('registerModal').classList.remove('open'); }
        function scrollSlider(o) { coursesContainer.scrollBy({ left: o, behavior: 'smooth' }); }
        function switchTab(t, e) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active')); e.classList.add('active'); document.getElementById(`tab-${t}`).classList.add('active'); }
        function toggleTheme() { document.body.classList.toggle('dark-theme'); }
        window.onload = loadClasses;
    </script>
</body>
</html>

Các tính năng tìm kiếm và tìm lớp học gần bạn hiện đã sẵn sàng để hoạt động. Chúc bạn trải nghiệm tốt!
