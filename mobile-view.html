<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAETON Badminton - Mobile View</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        (function() {
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                           || window.innerWidth <= 768;
            if (!isMobile) {
                // Giữ lại tham số user và role khi quay về desktop nếu có
                window.location.href = "index.html" + window.location.search;
            }
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #000000;
            padding-bottom: 20px;
        }

        /* --- Neo-Brutalism Header Style --- */
        header {
            background-color: #ffe600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 3px solid #000000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hamburger-btn, .noti-bell-btn {
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px #000000;
            font-size: 1.2rem;
            cursor: pointer;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .noti-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ef4444;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 50%;
            font-weight: bold;
            border: 1px solid #000000;
        }

        /* --- Sidebar Drawer --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 75%;
            height: 100%;
            background-color: #ffffff;
            border-right: 3px solid #000000;
            transition: 0.3s ease;
            z-index: 200;
            padding: 20px;
        }
        .sidebar.active { left: 0; }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 150;
        }
        .sidebar-overlay.active { display: block; }

        .user-info-box {
            background: #f3f4f6;
            padding: 12px;
            border: 2px solid #000000;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 12px; }
        .sidebar-menu a {
            text-decoration: none;
            color: #000000;
            font-size: 1rem;
            display: block;
            padding: 12px;
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px #000000;
            font-weight: bold;
        }

        /* --- Notification Dropdown --- */
        .noti-dropdown {
            position: fixed;
            top: 65px; left: 5%; width: 90%;
            background: #ffffff;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            z-index: 140;
            display: none;
            max-height: 350px;
            overflow-y: auto;
        }
        .noti-dropdown.show { display: block; }
        .noti-header {
            background: #f3f4f6;
            padding: 10px;
            font-weight: bold;
            border-bottom: 2px solid #000000;
            display: flex;
            justify-content: space-between;
        }
        .noti-item {
            padding: 12px;
            border-bottom: 1px dashed #000000;
            font-size: 0.85rem;
        }
        .noti-item.unread { background: rgba(255, 230, 0, 0.15); font-weight: bold; }
        .noti-time { font-size: 0.75rem; color: #666; margin-top: 4px; text-align: right; }
        .noti-empty { padding: 20px; text-align: center; font-style: italic; color: #777; }

        /* --- Main Content --- */
        main { padding: 15px; }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-left: 5px solid #ffe600;
            padding-left: 8px;
        }

        /* --- Mobile Cards Layout (Đồng bộ từ Database) --- */
        .card-container { display: flex; flex-direction: column; gap: 15px; }
        .course-card {
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }
        .card-header {
            background: #f3f4f6;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 1rem;
            border-bottom: 2px solid #000000;
        }
        .card-body { padding: 15px; font-size: 0.9rem; line-height: 1.5; }
        .card-body p { margin-bottom: 5px; display: flex; justify-content: space-between; }
        .card-body p span { font-weight: bold; }
        .card-footer { padding: 10px 15px; border-top: 1px dashed #000000; }

        /* --- Buttons --- */
        .btn-block {
            width: 100%;
            min-height: 44px;
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px #000000;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-block:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #000000; }
        .btn-reg-active { background-color: #ffe600 !important; }
        .btn-disabled { background-color: #e5e7eb !important; color: #9ca3af !important; box-shadow: none !important; cursor: not-allowed; }

        /* --- Popup Modal Xem Hồ Sơ & Đăng Ký --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 999; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: #ffffff;
            border: 3px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            width: 90%; max-height: 85vh;
            display: flex; flex-direction: column;
        }
        .modal-box-header {
            background: #ffe600;
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            border-bottom: 3px solid #000000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-box-body { padding: 15px; overflow-y: auto; font-size: 0.85rem; line-height: 1.5; }
        .modal-box-footer { padding: 12px; border-top: 2px dashed #000000; display: flex; gap: 10px; background: #f3f4f6; }
        
        .coach-profile-summary { display: flex; gap: 12px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px dashed #000000; }
        .coach-avatar-img { width: 75px; height: 95px; border: 2px solid #000000; object-fit: cover; box-shadow: 2px 2px 0px #000000; }
        .badge-title { background: #000000; color: #ffffff; padding: 2px 6px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 6px; }
        .btn-confirm-reg { background-color: #22c55e !important; color: white !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BAETON Mobile</div>
        <div class="header-actions">
            <button class="noti-bell-btn" id="mobileNotiBell" style="display: none;" onclick="toggleMobileNoti(event)">
                <i class="fa-solid fa-bell"></i>
                <span class="noti-badge" id="mobileNotiBadge" style="display: none;">0</span>
            </button>
            <button class="hamburger-btn" id="menuBtn">☰</button>
        </div>
    </header>

    <div class="noti-dropdown" id="mobileNotiDropdown" onclick="event.stopPropagation()">
        <div class="noti-header">
            <span>Thông báo mới nhận</span>
            <span style="color: #ef4444;" onclick="toggleMobileNoti(event)">Đóng</span>
        </div>
        <div id="mobileNotiContent">
            <div class="noti-empty">Đang tải thông báo...</div>
        </div>
    </div>

    <div class="sidebar-overlay" id="overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="user-info-box" id="mobileUserInfo">
            <i class="fa-solid fa-user-slash"></i> Khách vãng lai
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" onclick="toggleMenu()">Trang Chủ Lớp Học</a></li>
            <div id="mobileCoachMenu" style="display: none;">
                <li><a href="#" id="lnkDashboard">Mở Lớp Mới (HLV)</a></li>
                <li><a href="#" id="lnkManage">Quản Lý Lớp Học (HLV)</a></li>
            </div>
            <li><a href="index.html" style="background-color: #f3f4f6;">Đăng Xuất / Quay Lại</a></li>
        </ul>
    </div>

    <main>
        <div class="section-title">Danh Sách Lớp Học Thực Tế</div>
        <div class="card-container" id="mobileCardsContainer">
            <div style="text-align: center; padding: 30px; font-weight: bold;">
                <i class="fa-solid fa-spinner fa-spin"></i> Đang đồng bộ dữ liệu lớp học...
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="mobileModal">
        <div class="modal-box">
            <div class="modal-box-header">
                <span>XÁC NHẬN ĐĂNG KÝ HỌC</span>
                <i class="fa-solid fa-xmark" style="cursor:pointer; font-size: 1.2rem;" onclick="closeMobileModal()"></i>
            </div>
            <div class="modal-box-body" id="mobileModalBody"></div>
            <div class="modal-box-footer">
                <button class="btn-block" style="flex: 1;" onclick="closeMobileModal()">Hủy</button>
                <button class="btn-block btn-confirm-reg" style="flex: 1;" id="btnMobileSubmitReg">Xác nhận</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const loggedUser = urlParams.get('user');
        const userRole = urlParams.get('role');
        const cardsContainer = document.getElementById('mobileCardsContainer');
        let allLocalClasses = [];

        // 1. Kiểm tra trạng thái và phân quyền Menu tài khoản
        if (loggedUser) {
            document.getElementById('mobileUserInfo').innerHTML = `<i class="fa-solid fa-user-check" style="color:#22c55e;"></i> Xin chào, ${decodeURIComponent(loggedUser)}`;
            
            if (userRole === 'coach') {
                document.getElementById('mobileNotiBell').style.display = 'flex';
                document.getElementById('mobileCoachMenu').style.display = 'block';
                
                // Gắn liên kết kèm token định danh cho HLV sang trang quản lý
                document.getElementById('lnkDashboard').href = `dashboard_hlv.html?user=${encodeURIComponent(loggedUser)}&role=coach`;
                document.getElementById('lnkManage').href = `manage_classes.html?user=${encodeURIComponent(loggedUser)}&role=coach`;
                
                loadMobileNotifications();
            }
        }

        // 2. Hàm lấy danh sách thông báo Realtime cho HLV
        function loadMobileNotifications() {
            if (!loggedUser || userRole !== 'coach') return;
            const callbackName = 'jsonp_mob_noti_' + Date.now();
            
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                
                if (data.status === "success" && data.notifications) {
                    const contentDiv = document.getElementById('mobileNotiContent');
                    contentDiv.innerHTML = "";
                    
                    const unreadCount = data.notifications.filter(n => n.status === 'unread').length;
                    const badge = document.getElementById('mobileNotiBadge');
                    
                    if (unreadCount > 0) {
                        badge.innerText = unreadCount;
                        badge.style.display = 'block';
                    } else {
                        badge.style.display = 'none';
                    }
                    
                    if (data.notifications.length === 0) {
                        contentDiv.innerHTML = `<div class="noti-empty">Không có thông báo nào.</div>`;
                        return;
                    }
                    
                    data.notifications.forEach(noti => {
                        const div = document.createElement('div');
                        div.className = `noti-item ${noti.status === 'unread' ? 'unread' : ''}`;
                        div.innerHTML = `
                            <div>${noti.content}</div>
                            <div class="noti-time">${noti.time}</div>
                        `;
                        contentDiv.appendChild(div);
                    });
                }
            };
            
            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=get_notifications&coachName=${encodeURIComponent(loggedUser)}&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        // Đóng mở dropdown thông báo và đồng bộ trạng thái "Đã đọc" về Sheet
        function toggleMobileNoti(event) {
            if (event) event.stopPropagation();
            const dropdown = document.getElementById('mobileNotiDropdown');
            dropdown.classList.toggle('show');
            
            if (dropdown.classList.contains('show')) {
                const badge = document.getElementById('mobileNotiBadge');
                if (badge) badge.style.display = 'none';
                
                document.querySelectorAll('.noti-item.unread').forEach(item => item.classList.remove('unread'));
                
                // Gọi ngầm API cập nhật trạng thái lên Database
                const callbackName = 'jsonp_mob_read_' + Date.now();
                window[callbackName] = function() {
                    delete window[callbackName];
                    document.getElementById(callbackName).remove();
                };
                const script = document.createElement('script');
                script.src = `${CONFIG.WEB_APP_URL}?action=mark_notifications_read&coachName=${encodeURIComponent(loggedUser)}&callback=${callbackName}`;
                script.id = callbackName;
                document.body.appendChild(script);
            }
        }

        // 3. Đồng bộ danh sách lớp học từ Google Sheets về giao diện Mobile
        function loadMobileClasses() {
            const callbackName = 'jsonp_mob_load_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                if (data.status === "success") {
                    allLocalClasses = data.classes;
                    renderMobileCards(allLocalClasses);
                }
            };
            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=get_classes&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        function renderMobileCards(list) {
            cardsContainer.innerHTML = "";
            if(list.length === 0) {
                cardsContainer.innerHTML = `<div class="noti-empty">Hiện tại hệ thống chưa có lớp học nào được mở.</div>`;
                return;
            }

            list.forEach(cls => {
                let isFull = false;
                if (cls.slots && cls.slots.includes('/')) {
                    const parts = cls.slots.split('/');
                    if (parseInt(parts[0], 10) >= parseInt(parts[1], 10)) isFull = true;
                }

                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <div class="card-header">${cls.className}</div>
                    <div class="card-body">
                        <p>Khu vực: <span>${cls.area}</span></p>
                        <p>Trình độ: <span>${cls.level}</span></p>
                        <p>Học phí: <span style="color:#ef4444;">${cls.fee}</span></p>
                        <p>Số lượng: <span id="mob_slot_${cls.id}">${cls.slots}</span></p>
                        <p>Huấn luyện viên: <span>${cls.coach}</span></p>
                    </div>
                    <div class="card-footer" id="mob_footer_${cls.id}">
                        ${userRole === 'coach' ? '' : (isFull ? '<button class="btn-block btn-disabled" disabled>Lớp đã đầy chỗ</button>' : `<button class="btn-block btn-reg-active" onclick="openMobileRegisterPopup('${cls.id}')">Đăng ký ngay</button>`)}
                    </div>
                `;
                cardsContainer.appendChild(card);
            });
        }

        // 4. Mở Popup Xem hồ sơ HLV và Đăng ký lớp
        function openMobileRegisterPopup(classId) {
            if (!loggedUser) return alert("Vui lòng đăng nhập hệ thống trước khi thực hiện đăng ký!");
            const cls = allLocalClasses.find(c => c.id === classId);
            if (!cls) return;

            const modalBody = document.getElementById('mobileModalBody');
            modalBody.innerHTML = `<div style="text-align:center;padding:15px;"><i class="fa-solid fa-spinner fa-spin"></i> Đang truy xuất dữ liệu HLV...</div>`;
            document.getElementById('mobileModal').classList.add('open');

            const callbackName = 'jsonp_mob_coach_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                
                let coach = data.coach || {};
                modalBody.innerHTML = `
                    <div class="badge-title"><i class="fa-solid fa-id-card"></i> Hồ sơ HLV</div>
                    <div class="coach-profile-summary">
                        <img src="${coach.avatar}" class="coach-avatar-img">
                        <div>
                            <strong>HLV:</strong> ${cls.coach}<br>
                            <strong>Tuổi:</strong> ${coach.age}<br>
                            <strong>SĐT:</strong> ${coach.phone}<br>
                            <strong>Thời gian dạy:</strong> ${coach.teachingTime}
                        </div>
                    </div>
                    <div style="margin-bottom:12px; background:#f9f9f9; padding:8px; border:1px solid #ddd; font-style:italic;">
                        <strong>Thành tích:</strong> ${coach.achievements}
                    </div>
                    <div class="badge-title"><i class="fa-solid fa-circle-info"></i> Lớp đăng ký</div>
                    <div style="padding-left:4px;">
                        <strong>Lớp học:</strong> ${cls.className}<br>
                        <strong>Khu vực:</strong> ${cls.area}<br>
                        <strong>Học phí:</strong> <span style="color:#ef4444; font-weight:bold;">${cls.fee}</span>
                    </div>
                `;
                
                document.getElementById('btnMobileSubmitReg').onclick = function() {
                    executeMobileRegistration(cls.id, cls.className, cls.coach, cls.slots);
                };
            };

            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=get_coach_detail&coachName=${encodeURIComponent(cls.coach)}&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        // 5. Gửi lệnh API Đăng ký và tăng slot Realtime lên Sheet
        function executeMobileRegistration(id, name, coachName, currentSlots) {
            const btn = document.getElementById('btnMobileSubmitReg');
            btn.disabled = true;
            btn.innerText = "Đang xử lý...";

            const callbackName = 'jsonp_mob_reg_' + Date.now();
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();
                btn.disabled = false;
                btn.innerText = "Xác nhận";
                
                if (data.status === "success") {
                    alert("Đăng ký thành công! Hệ thống đã gửi thông báo đến Huấn luyện viên.");
                    closeMobileModal();
                    
                    // Cập nhật tăng slot ngay tại giao diện hiển thị
                    const parts = currentSlots.split('/');
                    const newCount = parseInt(parts[0], 10) + 1;
                    const maxCount = parseInt(parts[1], 10);
                    const updatedStr = newCount + "/" + maxCount;
                    
                    if(document.getElementById(`mob_slot_${id}`)) {
                        document.getElementById(`mob_slot_${id}`).innerText = updatedStr;
                    }
                    
                    const targetedClass = allLocalClasses.find(c => c.id === id);
                    if(targetedClass) targetedClass.slots = updatedStr;

                    if (newCount >= maxCount) {
                        if(document.getElementById(`mob_footer_${id}`)) {
                            document.getElementById(`mob_footer_${id}`).innerHTML = '<button class="btn-block btn-disabled" disabled>Lớp đã đầy chỗ</button>';
                        }
                    }
                } else {
                    alert(data.message);
                }
            };

            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=register_student&classId=${id}&className=${encodeURIComponent(name)}&studentName=${encodeURIComponent(loggedUser)}&coachName=${encodeURIComponent(coachName)}&callback=${callbackName}`;
            script.id = callbackName;
            document.body.appendChild(script);
        }

        function closeMobileModal() { document.getElementById('mobileModal').classList.remove('open'); }

        // Hiệu ứng đóng mở Menu Drawer trái
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
        menuBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // Đóng dropdown thông báo nếu click ra ngoài
        window.addEventListener('click', function() {
            const dropdown = document.getElementById('mobileNotiDropdown');
            if (dropdown) dropdown.classList.remove('show');
        });

        window.onload = loadMobileClasses;
    </script>
</body>
</html>
