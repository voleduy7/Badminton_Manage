<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Time - Đăng ký</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .register-container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        .logo {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .title {
            font-size: 24px;
            margin-bottom: 30px;
        }
        .form-group {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 20px;
            width: 160px;
            text-align: left;
        }
        .input-wrapper {
            width: 300px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            font-size: 18px;
            border: 2px solid #000000;
            box-sizing: border-box;
            outline: none;
            background-color: white;
        }
        .btn-register {
            margin-top: 15px;
            padding: 8px 30px;
            font-size: 18px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-register:hover {
            background-color: #ffffff;
            color: #000000;
        }
        .message-output {
            font-size: 16px;
            margin-top: 20px;
            height: 24px;
            font-weight: 500;
        }
        .footer-text {
            font-size: 16px;
            margin-top: 35px;
            color: #333333;
        }
        .footer-text a {
            text-decoration: none;
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="logo">TRAINING TIME</div>
        <div class="title">Đăng ký tài khoản</div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Tên đăng nhập:</label>
                <div class="input-wrapper">
                    <input type="text" id="username" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Mật khẩu:</label>
                <div class="input-wrapper">
                    <input type="password" id="password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <div class="input-wrapper">
                    <input type="text" id="phone" required placeholder="03xxxxxxxx">
                </div>
            </div>

            <div class="form-group">
                <label for="role">Vai trò:</label>
                <div class="input-wrapper">
                    <select id="role">
                        <option value="student">Học viên</option>
                        <option value="coach">Huấn luyện viên</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-register">Đăng ký</button>
            <div class="message-output" id="msgOut"></div>
        </form>
        
        <div class="footer-text">Đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
    </div>

    <script src="config.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const phone = document.getElementById('phone').value.trim();
            const role = document.getElementById('role').value;
            const msgOut = document.getElementById('msgOut');

            const vnf_regex = /^(03|05|07|08|09)+([0-9]{8})$/;
            if (!vnf_regex.test(phone)) {
                msgOut.style.color = "red";
                msgOut.innerText = "Số điện thoại không đúng định dạng Việt Nam!";
                return;
            }

            msgOut.style.color = "blue";
            msgOut.innerText = "Đang xử lý đăng ký...";

            const hashPassword = CryptoJS.MD5(pass).toString();
            const callbackName = 'jsonp_callback_register_' + Math.round(100000 * Math.random());
            
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.getElementById(callbackName).remove();

                if (data.status === "success") {
                    msgOut.style.color = "green";
                    msgOut.innerText = "Đăng ký thành công! Đang chuyển hướng về trang đăng nhập...";
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    msgOut.style.color = "red";
                    msgOut.innerText = data.message;
                }
            };

            const script = document.createElement('script');
            script.src = `${CONFIG.WEB_APP_URL}?action=register&username=${encodeURIComponent(user)}&password=${hashPassword}&phone=${encodeURIComponent(phone)}&role=${encodeURIComponent(role)}&callback=${callbackName}`;
            script.id = callbackName;
            
            script.onerror = function() {
                msgOut.style.color = "red";
                msgOut.innerText = "Có lỗi xảy ra khi kết nối database.";
                delete window[callbackName];
            };

            document.body.appendChild(script);
        });
    </script>
</body>
</html>
